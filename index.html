<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Moad Almshirem — Software Engineer</title>
    <meta name="description" content="Portfolio of Moad Almshirem, a software engineer building mobile and web products with Flutter, React and TypeScript." />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F1F5F8" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#080C12" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Moad Almshirem — Software Engineer" />
    <meta property="og:description" content="Engineering digital experiences that move ideas forward. Mobile and web products built with Flutter, React and TypeScript." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=Tajawal:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply theme and language before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('portfolio.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.setAttribute('data-theme', theme);
          var lang = localStorage.getItem('portfolio.lang');
          if (lang !== 'en' && lang !== 'ar') {
            lang = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
          }
          root.setAttribute('lang', lang);
          root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
    <style>
      /* Boot skeleton: painted from HTML alone while the JS bundle downloads. React replaces it on mount. */
      .boot { --b-bg: #f1f5f8; --b-block: #e2e9ef; --b-hi: rgba(255,255,255,.8); min-height: 100svh; background: var(--b-bg); display: flex; flex-direction: column; }
      [data-theme="dark"] .boot { --b-bg: #080c12; --b-block: #141c25; --b-hi: rgba(255,255,255,.06); }
      [data-theme="dark"] body { background: #080c12; }
      .boot-shell { width: min(100% - 2.5rem, 84rem); margin-inline: auto; }
      @media (min-width: 768px) { .boot-shell { width: min(100% - 4rem, 84rem); } }
      .boot-bar { display: flex; align-items: center; justify-content: space-between; padding-block: 1.25rem; }
      .boot-row { display: flex; gap: .75rem; }
      .boot-hero { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 1rem; padding-block: 3.5rem; }
      @media (min-width: 1024px) { .boot-hero { justify-content: center; } }
      .sk { display: block; border-radius: 999px; background: var(--b-block) linear-gradient(100deg, transparent 25%, var(--b-hi) 50%, transparent 75%) no-repeat; background-size: 200% 100%; animation: sk 1.5s ease-in-out infinite; }
      @keyframes sk { from { background-position: 150% 0; } to { background-position: -50% 0; } }
      @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" aria-busy="true" aria-label="Loading">
        <div class="boot-shell boot-bar">
          <span class="sk" style="width:7.5rem;height:2.25rem"></span>
          <span class="boot-row"><span class="sk" style="width:2.5rem;height:2.5rem"></span><span class="sk" style="width:2.5rem;height:2.5rem"></span></span>
        </div>
        <div class="boot-shell boot-hero">
          <span class="sk" style="width:11rem;height:1.75rem"></span>
          <span class="sk" style="width:min(100%,40rem);height:clamp(2.5rem,7vw,4.5rem);border-radius:1rem"></span>
          <span class="sk" style="width:min(80%,30rem);height:clamp(2.5rem,7vw,4.5rem);border-radius:1rem"></span>
          <span class="sk" style="width:min(100%,34rem);height:.9rem;margin-top:.75rem"></span>
          <span class="sk" style="width:min(70%,26rem);height:.9rem"></span>
          <span class="boot-row" style="margin-top:1rem"><span class="sk" style="width:9rem;height:3rem"></span><span class="sk" style="width:9rem;height:3rem"></span></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
