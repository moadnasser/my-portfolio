    <script>
      // Apply theme and language before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('portfolio.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.setAttribute('data-theme', theme);
          var lang = localStorage.getItem('portfolio.lang');
          if (lang !== 'en' && lang !== 'ar') {
            lang = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
          }
          root.setAttribute('lang', lang);
          root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>

    <style>
      /* Boot skeleton: painted from HTML alone while the JS bundle downloads, in the shape of the hero

      .boot { --b-bg: #edf1f4; --b-block: #dde5eb; --b-hi: rgba(255,255,255,.8); --b-arch: #2aabee; position: relative; height: 100svh; overflow: hidden; background: var(--b-bg); padding: 1rem max(1.25rem, calc((100vw - 92rem) / 2)) 0; box-sizing: border-box; }
      [data-theme="dark"] .boot { --b-bg: #070b10; --b-block: #141c25; --b-hi: rgba(255,255,255,.06); }
      /* Before the stylesheet arrives there is no reset: without this the page shows a margin in the wrong colour. */
      html, body { margin: 0; background: #edf1f4; }
      html[data-theme="dark"], [data-theme="dark"] body { background: #070b10; }
      .boot-bar { display: flex; align-items: center; justify-content: space-between; }
      .sk { display: block; border-radius: .75rem; background: var(--b-block) linear-gradient(100deg, transparent 25%, var(--b-hi) 50%, transparent 75%) no-repeat; background-size: 200% 100%; animation: sk 1.5s ease-in-out infinite; }
      .boot-name { margin-top: max(2.25rem, 6svh); display: flex; flex-direction: column; gap: 1.6vw; }
      .boot-name .sk { height: 13.5vw; max-height: 13.5rem; }
      .boot-arch { position: absolute; bottom: 0; left: 50%; width: clamp(15rem, 25.5vw, 26rem); height: 60svh; margin-left: calc(clamp(15rem, 25.5vw, 26rem) / -2); border-radius: 999px 999px 0 0; background: var(--b-arch); opacity: .9; }
      @keyframes sk { from { background-position: 150% 0; } to { background-position: -50% 0; } }
      @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
    </style>
