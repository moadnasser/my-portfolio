    <!-- Fonts never block first paint: the sheet loads as a preload and is switched on when it arrives. -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&family=Tajawal:wght@400;500;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />

    <script>
      // Apply theme and language before first paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var root = document.documentElement;
          var theme = localStorage.getItem('portfolio.theme');
          if (theme !== 'light' && theme !== 'dark') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          root.setAttribute('data-theme', theme);
          var lang = localStorage.getItem('portfolio.lang');
          if (lang !== 'en' && lang !== 'ar') {
            lang = /^ar\b/i.test(navigator.language || '') ? 'ar' : 'en';
          }
          root.setAttribute('lang', lang);
          root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {}
      })();
    </script>
    <link rel="preload" as="image" href="/projects/uab-home.jpg" />
    <style>
      /* Boot skeleton: painted from HTML alone while the JS bundle downloads, in the shape of the hero
         (bar, centred statement, two actions, the phone rising from below). React replaces it on mount. */
      .boot { --b-bg: #ffffff; --b-bar: #f1f5f8; --b-block: #e6edf2; --b-hi: rgba(255,255,255,.85); height: 100svh; overflow: hidden; background: var(--b-bg); display: flex; flex-direction: column; align-items: center; }
      [data-theme="dark"] .boot { --b-bg: #080c12; --b-bar: #0a0f15; --b-block: #141c25; --b-hi: rgba(255,255,255,.06); }
      /* Before the stylesheet arrives there is no reset: without this the page shows a margin in the wrong colour. */
      html, body { margin: 0; background: #ffffff; }
      html[data-theme="dark"], [data-theme="dark"] body { background: #080c12; }
      .boot-bar { align-self: stretch; height: 3rem; background: var(--b-bar); display: flex; align-items: center; justify-content: space-between; padding-inline: max(1.25rem, calc((100vw - 84rem) / 2)); }
      .boot-row { display: flex; gap: .75rem; align-items: center; }
      .boot-hero { display: flex; flex-direction: column; align-items: center; gap: 1rem; padding-top: max(2.5rem, 8svh); width: min(100% - 2.5rem, 60rem); }
      .sk { display: block; border-radius: 999px; background: var(--b-block) linear-gradient(100deg, transparent 25%, var(--b-hi) 50%, transparent 75%) no-repeat; background-size: 200% 100%; animation: sk 1.5s ease-in-out infinite; }
      /* After .sk so their corner radii win. */
      .boot-line { height: min(clamp(2.4rem, 6vw, 5.4rem), 9svh); border-radius: 1rem; }
      .boot-phone { margin-top: auto; width: min(64vw, 19rem); height: 30svh; border-radius: 2.6rem 2.6rem 0 0; flex: none; }
      @keyframes sk { from { background-position: 150% 0; } to { background-position: -50% 0; } }
      @media (prefers-reduced-motion: reduce) { .sk { animation: none; } }
    </style>
  </head>

          <span class="boot-row"><span class="sk" style="width:3.5rem;height:1rem"></span><span class="sk" style="width:5.5rem;height:2rem"></span></span>
        </div>
        <div class="boot-hero">
          <span class="sk" style="width:14rem;height:1.1rem"></span>
          <span class="sk boot-line" style="width:min(100%,46rem)"></span>

        <span class="sk boot-phone"></span>
      </div>
    </div>
